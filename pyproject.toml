[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.2.0"
description = "Portable ChatGPT-style agent operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "openai",
  "python-multipart",
  "python-dotenv",
]

[project.scripts]
forge = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
